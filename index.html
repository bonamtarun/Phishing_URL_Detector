<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Advanced Phishing URL Detector - Protect yourself from malicious websites with machine learning-powered URL analysis">
    <title>🛡️ Phishing URL Detector | Secure Your Browsing</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --danger-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --shadow-glow: 0 8px 32px 0 rgba(102, 126, 234, 0.37);
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Particle Background */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Floating Security Icons */
        .floating-icon {
            position: absolute;
            font-size: 2rem;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
            z-index: 1;
        }

        .floating-icon:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-icon:nth-child(2) {
            top: 20%;
            right: 15%;
            animation-delay: 1s;
        }

        .floating-icon:nth-child(3) {
            bottom: 15%;
            left: 20%;
            animation-delay: 2s;
        }

        .floating-icon:nth-child(4) {
            bottom: 25%;
            right: 10%;
            animation-delay: 3s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            max-width: 550px;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            padding: 50px 40px;
            box-shadow: var(--shadow-glow), 0 0 80px rgba(126, 34, 206, 0.3);
            animation: slideIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .shield-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.8));
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 300;
        }

        /* Input Group */
        .input-group {
            position: relative;
            margin-bottom: 30px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .url-icon {
            position: absolute;
            left: 20px;
            font-size: 1.3rem;
            z-index: 2;
            opacity: 0.6;
            transition: all 0.3s ease;
        }

        input {
            width: 100%;
            padding: 18px 20px 18px 55px;
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        input:focus {
            border-color: rgba(102, 126, 234, 0.8);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
        }

        input:focus+.url-icon {
            opacity: 1;
            color: #667eea;
        }

        /* Button */
        .btn-check {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            background: var(--primary-gradient);
            color: var(--text-primary);
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-check::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-check:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .btn-check:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-check:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-check.loading .btn-text {
            display: none;
        }

        .btn-check.loading .spinner {
            display: block;
        }

        /* Result Display */
        #result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            font-weight: 500;
            font-size: 1.05rem;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: none;
        }

        #result.show {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        #result.safe {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.2) 0%, rgba(0, 242, 254, 0.2) 100%);
            border: 2px solid rgba(79, 172, 254, 0.5);
            color: #4facfe;
        }

        #result.danger {
            background: linear-gradient(135deg, rgba(250, 112, 154, 0.2) 0%, rgba(254, 225, 64, 0.2) 100%);
            border: 2px solid rgba(250, 112, 154, 0.5);
            color: #fa709a;
        }

        .result-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: block;
            animation: scaleIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }

            to {
                transform: scale(1);
            }
        }

        /* Footer */
        .footer {
            margin-top: 30px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .footer a {
            color: #a78bfa;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: #ffffff;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
                border-radius: 25px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .shield-icon {
                font-size: 3rem;
            }

            .floating-icon {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            input {
                padding: 15px 15px 15px 50px;
            }

            .btn-check {
                padding: 15px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <!-- Particle Canvas -->
    <canvas id="particles"></canvas>

    <!-- Floating Security Icons -->
    <div class="floating-icon">🔒</div>
    <div class="floating-icon">🛡️</div>
    <div class="floating-icon">🔐</div>
    <div class="floating-icon">⚠️</div>

    <!-- Main Container -->
    <div class="container">
        <div class="header">
            <div class="shield-icon">🛡️</div>
            <h1>Phishing URL Detector</h1>
            <p class="subtitle">Machine Learning Security Analysis</p>
        </div>

        <div class="input-group">
            <div class="input-wrapper">
                <input type="text" id="urlInput" placeholder="Enter URL to analyze (e.g., https://example.com)"
                    autocomplete="off" spellcheck="false" />
                <span class="url-icon">🔗</span>
            </div>
        </div>

        <button class="btn-check" onclick="checkURL()">
            <span class="btn-text">🔍 Analyze URL</span>
            <div class="spinner"></div>
        </button>

        <div id="result"></div>

    </div>

    <script>
        // Particle Background Animation
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const particleCount = 80;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animate);
        }

        init();
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // URL Validation
        function isValidURL(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }

        // Check URL Function
        async function checkURL() {
            const input = document.getElementById("urlInput");
            const resultDiv = document.getElementById("result");
            const button = document.querySelector(".btn-check");
            let url = input.value.trim();

            // Validation
            if (!url) {
                showResult("⚠️", "Please enter a URL to analyze", "danger");
                return;
            }

            // Don't auto-add protocol - let backend detect invalid protocols
            // Validate URL format
            if (!url.includes('://')) {
                showResult("❌", "Invalid URL format. Please include the protocol (http:// or https://)", "danger");
                return;
            }

            // Show loading state
            button.classList.add('loading');
            button.disabled = true;
            resultDiv.classList.remove('show');

            try {
                const response = await fetch("http://127.0.0.1:5000/check_url", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                // Determine if suspicious or safe
                const isSuspicious = data.result.toLowerCase().includes("suspicious") ||
                    data.result.toLowerCase().includes("phishing") ||
                    data.result.toLowerCase().includes("malicious");

                const icon = isSuspicious ? "🚨" : "✅";
                const type = isSuspicious ? "danger" : "safe";

                showResult(icon, data.result, type);

            } catch (error) {
                console.error("Error:", error);
                showResult("⚠️", "Unable to connect to the analysis server. Please ensure the backend is running.", "danger");
            } finally {
                button.classList.remove('loading');
                button.disabled = false;
            }
        }

        // Show Result with Animation
        function showResult(icon, message, type) {
            const resultDiv = document.getElementById("result");
            resultDiv.innerHTML = `<span class="result-icon">${icon}</span>${message}`;
            resultDiv.className = '';
            resultDiv.classList.add(type, 'show');
        }

        // Enter key support
        document.getElementById("urlInput").addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                checkURL();
            }
        });

        // Clear result when typing
        document.getElementById("urlInput").addEventListener("input", function () {
            const resultDiv = document.getElementById("result");
            if (resultDiv.classList.contains('show')) {
                resultDiv.classList.remove('show');
            }
        });
    </script>
</body>

</html>
